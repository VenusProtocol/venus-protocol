<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="906" viewBox="0 0 1000 906" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { stroke-width: 1.6; rx: 8; }
      .lbl { fill: #0f172a; font-size: 13px; }
      .lbl b { font-weight: 600; }
      .edge { stroke: #475569; stroke-width: 1.6; fill: none; }
      .elbl { fill: #334155; font-size: 12px; font-style: italic; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
      .bul { fill: #0f172a; font-size: 11.5px; }
      .bmono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #0f172a; }
      .grp { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="906" fill="#ffffff"/>

  <!-- atomic-liquidate grouping backdrop -->
  <rect class="grp" x="92" y="270" width="456" height="520" rx="12"/>
  <text class="mono" x="108" y="290" fill="#475569" font-weight="600">2 · atomic-liquidate.ts</text>
  <text class="mono" x="540" y="290" fill="#475569" font-weight="600" text-anchor="end">DRY_RUN=1</text>

  <!-- ============================ edges ============================ -->
  <!-- start -> native-smoke -->
  <path class="edge" d="M320,52 L320,82" marker-end="url(#arrow)"/>
  <!-- native-smoke -> quote decision -->
  <path class="edge" d="M320,140 L320,170" marker-end="url(#arrow)"/>
  <!-- a source is live -> atomic (SOURCE=auto picks it) -->
  <path class="edge" d="M320,228 L320,300" marker-end="url(#arrow)"/>
  <text class="elbl" x="328" y="266">live · auto</text>
  <!-- all sources dead -> straight to fallback -->
  <path class="edge" d="M456,199 L600,199"/>
  <text class="elbl" x="466" y="191">all sources dead</text>
  <!-- right rail spine — fed by decision, hop-1 no-source, VAI PSM-down, dry-run-fail — one entry into safe-fallback -->
  <path class="edge" d="M600,199 L600,737"/>
  <path class="edge" d="M600,505 L660,505" marker-end="url(#arrow)"/>
  <!-- preflight -> hop1 -->
  <path class="edge" d="M320,398 L320,416" marker-end="url(#arrow)"/>
  <!-- hop-1: no source fills (Native AND Liquid Mesh dead) -> rail -> fallback -->
  <path class="edge" d="M520,446 L600,446"/>
  <text class="elbl" x="528" y="438">no source fills</text>
  <!-- hop1 -> hop2 -->
  <path class="edge" d="M320,476 L320,494" marker-end="url(#arrow)"/>
  <!-- hop2 -> psm decision -->
  <path class="edge" d="M320,614 L320,632" marker-end="url(#arrow)"/>
  <!-- psm live / non-vai -> dry-run -->
  <path class="edge" d="M320,690 L320,708" marker-end="url(#arrow)"/>
  <text class="elbl" x="330" y="702">PSM live &#183; or non-VAI</text>
  <!-- psm down -> rail (tee) -->
  <path class="edge" d="M430,661 L600,661"/>
  <text class="elbl" x="440" y="652">VAI: PSM paused / cap full</text>
  <!-- dry-run yes -> send -->
  <path class="edge" d="M320,766 L320,812" marker-end="url(#arrow)"/>
  <text class="elbl" x="330" y="792">yes</text>
  <!-- dry-run no -> rail (tee) -->
  <path class="edge" d="M425,737 L600,737"/>
  <text class="elbl" x="440" y="728">no &#183; can't fix fast</text>
  <!-- safe-fallback -> execute -->
  <path class="edge" d="M818,554 L818,600" marker-end="url(#arrow)"/>

  <!-- ============================ nodes ============================ -->
  <!-- start -->
  <rect class="box" x="200" y="6" width="240" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="lbl" x="320" y="34" text-anchor="middle" font-weight="600">bStock borrower in shortfall</text>

  <!-- native-smoke -->
  <rect class="box" x="160" y="82" width="320" height="58" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text class="lbl mono" x="320" y="106" text-anchor="middle">1 · native-smoke.ts · lm-smoke.ts</text>
  <text class="lbl" x="320" y="124" text-anchor="middle" font-size="12">read-only, ~10s — which RFQ sources are live?</text>

  <!-- quote? decision -->
  <rect class="box" x="184" y="170" width="272" height="58" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="lbl" x="320" y="194" text-anchor="middle" font-weight="600">Any RFQ source live?</text>
  <text class="lbl" x="320" y="212" text-anchor="middle" font-size="11">native-smoke (Native) · lm-smoke (LM)</text>

  <!-- preflight gates -->
  <rect class="box" x="120" y="300" width="400" height="98" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text class="lbl" x="134" y="318" font-weight="600" font-size="12">pre-flight gates</text>
  <text class="bul" x="134" y="336">• detect debt: VAI · native BNB · ERC20 (USDT / other)</text>
  <text class="bul" x="134" y="354">• shortfall = 0 → ABORT unless ALLOW_NO_SHORTFALL=1 (forced)</text>
  <text class="bul" x="134" y="372">• VAI ⇒ MODE=inventory (flash rejected: no vVAI)</text>
  <text class="bul" x="134" y="390">• size seize − treasury cut (effective incentive)</text>

  <!-- hop-1 -->
  <rect class="box" x="120" y="416" width="400" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text class="lbl" x="134" y="440" font-size="12"><tspan font-weight="600">hop-1</tspan> bStock → USDT — Native / Liquid Mesh</text>
  <text class="bul" x="134" y="460">SOURCE=auto prices both, takes best out (LM if Native down)</text>

  <!-- hop-2 matrix -->
  <rect class="box" x="120" y="494" width="400" height="120" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text class="lbl" x="134" y="512" font-weight="600" font-size="12">hop-2 route — by debt type</text>
  <text class="bul" x="134" y="530">• USDT → single hop (hop-1 IS the debt asset)</text>
  <text class="bul" x="134" y="548">• ERC20 ≠ USDT → AMM: kyber / openocean / pcsv2</text>
  <text class="bul" x="134" y="566">• native BNB → USDT → WBNB (contract unwraps)</text>
  <text class="bmono" x="134" y="584">• VAI → PSM.swapStableForVAI  (calldata local, lib/psm.ts)</text>
  <text class="bul" x="146" y="602" fill="#4338ca">pause + mint-cap headroom pre-flighted next</text>

  <!-- PSM decision (VAI only) -->
  <rect class="box" x="210" y="632" width="220" height="58" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="lbl" x="320" y="656" text-anchor="middle" font-weight="600">VAI: PSM usable?</text>
  <text class="lbl" x="320" y="674" text-anchor="middle" font-size="11">not paused &amp; cap headroom ≥ pull</text>

  <!-- dry-run decision -->
  <rect class="box" x="215" y="708" width="210" height="58" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="lbl" x="320" y="732" text-anchor="middle" font-weight="600">Dry-run passes?</text>
  <text class="lbl" x="320" y="750" text-anchor="middle" font-size="11">callStatic liquidate / flashLiquidate</text>

  <!-- send (terminal, success) -->
  <rect class="box" x="120" y="812" width="400" height="72" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text class="lbl" x="320" y="836" text-anchor="middle" font-size="12">re-run WITHOUT <tspan class="mono">DRY_RUN=1</tspan></text>
  <text class="lbl" x="320" y="856" text-anchor="middle" font-weight="600">→ liquidation sent ✓</text>
  <text class="lbl" x="320" y="874" text-anchor="middle" font-size="11">MODE=inventory, or flash (non-VAI only)</text>

  <!-- safe fallback -->
  <rect class="box" x="660" y="456" width="316" height="98" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="lbl mono" x="818" y="480" text-anchor="middle">3 · safe-fallback.ts</text>
  <text class="lbl" x="818" y="500" text-anchor="middle" font-size="11">writes Safe batch JSON (no send)</text>
  <text class="lbl" x="818" y="518" text-anchor="middle" font-size="11">repay from Safe funds → seize → ship bStock</text>
  <text class="lbl" x="818" y="536" text-anchor="middle" font-size="11">no on-chain swap — RFQ / PSM independent</text>

  <!-- execute -->
  <rect class="box" x="660" y="600" width="316" height="84" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="lbl" x="818" y="624" text-anchor="middle" font-size="12">Safe → Transaction Builder</text>
  <text class="lbl" x="818" y="644" text-anchor="middle" font-size="11">load JSON, review, sign, execute</text>
  <text class="lbl" x="818" y="664" text-anchor="middle" font-size="11">raw bStock ships to CEX for offload</text>

  <!-- legend -->
  <rect x="660" y="724" width="300" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="lbl" x="676" y="744" font-weight="600" font-size="11">legend</text>
  <rect x="676" y="754" width="16" height="12" rx="3" fill="#f1f5f9" stroke="#64748b"/>
  <text class="bul" x="700" y="764">script step</text>
  <rect x="676" y="772" width="16" height="12" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text class="bul" x="700" y="782">decision</text>
  <rect x="676" y="790" width="16" height="12" rx="3" fill="#eef2ff" stroke="#6366f1"/>
  <text class="bul" x="700" y="800">hop-2 routing (VAI = PSM)</text>
  <rect x="676" y="808" width="16" height="12" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text class="bul" x="700" y="818">sent atomically</text>
  <rect x="676" y="826" width="16" height="12" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text class="bul" x="700" y="836">Safe multisig fallback</text>
</svg>
