name: Slither

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"

      - name: Install dependencies
        # Hack to get around failing "ethereumjs-abi The remote archive doesn't match the expected checksum" error
        run: YARN_CHECKSUM_BEHAVIOR=update yarn

      - name: Compile contracts
        # SLITHER=true keeps the sources generated by hardhat-dependency-compiler on disk.
        # Slither resolves every path recorded in build-info, so it fails if they are cleaned up.
        run: SLITHER=true yarn hardhat compile

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        id: slither
        with:
          ignore-compile: true
          slither-version: 0.11.6
          fail-on: none
          sarif: results.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
